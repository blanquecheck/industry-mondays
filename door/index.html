<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Door check-in · Industry Mondays</title>
<meta name="theme-color" content="#12061A">
<link rel="stylesheet" href="../styles.css?v=20261102b">
<style>
  /* Door check-in: one result panel on top, PIN or manual code entry below. */
  .door { max-width: 560px; margin: 0 auto; padding: 24px var(--gutter) 64px; display: grid; gap: 18px; }
  .result { border-radius: var(--radius); padding: 28px 24px; border: 1.5px solid var(--line-soft); background: var(--plum-800); min-height: 180px; display: grid; align-content: center; gap: 10px; }
  .result .big { font-size: clamp(36px, 11vw, 56px); }
  .result .name { font-size: 26px; font-weight: 700; }
  .result p { color: var(--cream-dim); }
  .result.in { background: #0F3A2C; border-color: var(--emerald); }
  .result.in .big { color: var(--emerald); }
  .result.already { background: #3A2A0B; border-color: #F2B33D; }
  .result.already .big { color: #F2B33D; }
  .result.unknown, .result.bad { background: #3A1018; border-color: var(--error); }
  .result.unknown .big, .result.bad .big { color: var(--error); }
  [hidden] { display: none !important; }
  .door form { margin-top: 0; }
  .door .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; }
  .door input { text-transform: uppercase; letter-spacing: .08em; }
  .forget { background: none; border: 0; color: var(--cream-dim); font: inherit; font-size: 13px; text-decoration: underline; cursor: pointer; padding: 8px 0; justify-self: start; }
</style>
</head>
<body>
<header class="bar"><span class="mono brand">Industry Mondays · Door</span></header>
<main class="door">
  <section id="result" class="result" role="status" aria-live="polite">
    <p class="display big" id="r-big">Ready</p>
    <p class="name" id="r-name"></p>
    <p id="r-sub">Scan a guest's QR code with your phone camera, or type their code below.</p>
  </section>

  <form id="pin-form" class="card" hidden>
    <label for="pin">Door PIN</label>
    <p class="fine" style="margin:6px 0 12px">For door staff. Guests: just show your QR code at the door.</p>
    <div class="row"><input id="pin" type="password" inputmode="numeric" autocomplete="off" required minlength="4"><button class="btn" type="submit">Save</button></div>
    <p class="err" id="pin-err"></p>
  </form>

  <form id="code-form" class="card" hidden>
    <label for="code">Check in by code</label>
    <div class="row" style="margin-top:10px"><input id="code" autocomplete="off" autocapitalize="characters" placeholder="IM-" maxlength="9" required><button class="btn" type="submit">Check in</button></div>
  </form>
  <button class="forget" id="forget" type="button" hidden>Sign out of door mode</button>
</main>
<script src="../config.js?v=20261102b"></script>
<script>
(() => {
  const cfg = window.IM_CONFIG || {};
  const $ = (id) => document.getElementById(id);
  const KEY = 'im_door_pin';
  const store = { get() { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } },
                  set(v) { try { localStorage.setItem(KEY, v); } catch (e) {} },
                  clear() { try { localStorage.removeItem(KEY); } catch (e) {} } };
  let pin = store.get();

  const show = (cls, big, name, sub) => {
    $('result').className = 'result ' + (cls || '');
    $('r-big').textContent = big; $('r-name').textContent = name || ''; $('r-sub').textContent = sub || '';
  };
  const call = async (body) => {
    const res = await fetch(cfg.RSVP_ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
    return res.json();
  };
  const mode = () => {
    $('pin-form').hidden = !!pin; $('code-form').hidden = !pin; $('forget').hidden = !pin;
    if (!pin) show('', 'Door staff only', '', 'Guests: show your QR code at the door. Staff: enter the door PIN once on this phone.');
  };
  const codeFromHash = () => decodeURIComponent(location.hash.slice(1)).toUpperCase().replace(/[^A-Z0-9-]/g, '');

  async function checkIn(code) {
    if (!code) return;
    show('', 'Checking…', code, '');
    try {
      const r = await call({ action: 'checkin', pin, code });
      if (!r.ok && r.error === 'pin') { pin = ''; store.clear(); mode(); show('bad', 'PIN changed', '', 'Enter the new door PIN.'); return; }
      if (!r.ok) throw new Error('server');
      if (r.status === 'in') show('in', 'Checked in', r.name, r.code + ' · ' + r.at + ' · Happy hour is free.');
      else if (r.status === 'already') show('already', 'Already in', r.name, r.code + ' checked in at ' + r.at + '.');
      else if (r.status === 'test') show('in', 'Test code', 'Scanner works', 'IM-TEST00 is the test email code. Nothing was saved.');
      else show('unknown', 'Not found', r.code, 'No RSVP with this code. Check the spelling or look them up by name in the Sheet.');
    } catch (e) { show('bad', 'No connection', code, 'Couldn’t reach the list. Check signal and try again.'); }
  }

  $('pin-form').addEventListener('submit', async (ev) => {
    ev.preventDefault(); $('pin-err').textContent = '';
    const p = $('pin').value.trim();
    try {
      const r = await call({ action: 'pin', pin: p });
      if (!r.ok) { $('pin-err').textContent = 'That PIN isn’t right.'; return; }
      pin = p; store.set(p); $('pin').value = ''; mode();
      show('', 'Ready', '', 'Scan a guest’s QR code with your phone camera, or type their code below.');
      checkIn(codeFromHash());
    } catch (e) { $('pin-err').textContent = 'Couldn’t reach the list. Try again.'; }
  });
  $('code-form').addEventListener('submit', (ev) => {
    ev.preventDefault();
    let c = $('code').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (c.startsWith('IM')) c = c.slice(2);
    $('code').value = '';
    checkIn('IM-' + c);
  });
  $('forget').addEventListener('click', () => { pin = ''; store.clear(); mode(); });
  window.addEventListener('hashchange', () => { if (pin) checkIn(codeFromHash()); });

  mode();
  if (pin) checkIn(codeFromHash());
})();
</script>
</body>
</html>
